name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          binary_dir="dist/codex-switch_${GOOS}_${GOARCH}"
          mkdir -p "${binary_dir}"
          go build -ldflags="-X codex-switch/internal/cli.Version=${GITHUB_REF_NAME}" -o "${binary_dir}/codex-switch" ./cmd/codex-switch
          tar -C "${binary_dir}" -czf "dist/codex-switch_${GOOS}_${GOARCH}.tar.gz" codex-switch
          rm -rf "${binary_dir}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/codex-switch_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create or update GitHub release
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.tar.gz --repo "${GH_REPO}" --clobber
          else
            gh release create "${tag}" dist/*.tar.gz \
              --repo "${GH_REPO}" \
              --title "${tag}" \
              --notes "Prebuilt binaries for codex-switch."
          fi
